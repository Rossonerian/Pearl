name: CI

on:
  push:
    branches: [ main, v3, "test/*", "feat/*", "fix/*" ]
  pull_request:
    branches: [ main, v3 ]

jobs:
  build-and-test:
    name: Build, Test & Security Benchmark
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          swift --version
          xcodebuild -version

      - name: Build Pearl
        run: swift build

      - name: Run Test Suites (PearlCoreTests, PearlToolsTests, PearlMemoryTests)
        run: swift test

      - name: Run Security Benchmark
        run: swift run --package-path Bench security_bench

      - name: Run Deterministic Router Evaluation
        run: swift run --package-path Bench router_eval
